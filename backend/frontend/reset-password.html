<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ComplaintPortal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0F3D2E 0%, #1a5c45 50%, #0a2a1f 100%);
  padding: 1.5rem;
  -webkit-font-smoothing: antialiased;
}
.reset-card {
  background: #fff;
  border-radius: 20px;
  padding: 2.5rem;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.card-icon {
  width: 56px; height: 56px;
  background: rgba(15,61,46,0.08);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; color: #0F3D2E;
  margin-bottom: 1.25rem;
}
h1 { font-size: 1.6rem; font-weight: 800; color: #1E293B; margin-bottom: 0.4rem; letter-spacing: -0.02em; }
.subtitle { font-size: 0.88rem; color: #64748B; margin-bottom: 1.75rem; line-height: 1.5; }
.form-group { margin-bottom: 1rem; }
.form-label { display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem; }
.input-wrap { position: relative; }
.input-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: #94A3B8; font-size: 0.9rem; }
.form-input {
  width: 100%; border: 1.5px solid #E2E8F0; border-radius: 10px;
  padding: 0.72rem 1rem 0.72rem 2.75rem;
  font-size: 0.9rem; font-family: 'Inter', sans-serif;
  color: #1E293B; background: #FAFAFA;
  transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
.form-input:focus { border-color: #0F3D2E; background: #fff; box-shadow: 0 0 0 3px rgba(15,61,46,0.1); }
.btn-reset {
  width: 100%; background: #0F3D2E; color: #fff;
  padding: 0.875rem; border-radius: 10px; border: none;
  font-size: 0.95rem; font-weight: 700; cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: filter 0.15s, transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  margin-top: 0.5rem;
}
.btn-reset:hover { filter: brightness(1.1); transform: translateY(-1px); }
.back-link {
  text-align: center; margin-top: 1.25rem;
  font-size: 0.85rem; color: #64748B;
}
.back-link span { color: #0F3D2E; font-weight: 600; cursor: pointer; }
.back-link span:hover { color: #D4A017; }
.otp-hint {
  background: rgba(212,160,23,0.08);
  border: 1px solid rgba(212,160,23,0.25);
  border-radius: 8px; padding: 0.75rem 1rem;
  font-size: 0.82rem; color: #92400E;
  margin-bottom: 1rem;
  display: flex; align-items: flex-start; gap: 0.5rem;
}
</style>
</head>
<body>
<div class="reset-card">
  <div class="card-icon"><i class="fa-solid fa-key"></i></div>
  <h1>Reset Password</h1>
  <p class="subtitle">Enter the OTP sent to your email along with your new password.</p>

  <div class="otp-hint">
    <i class="fa-solid fa-circle-info" style="margin-top:2px;flex-shrink:0;"></i>
    <span>Check your inbox for the OTP. It may take a few minutes to arrive.</span>
  </div>

  <div class="form-group">
    <label class="form-label">Email Address</label>
    <div class="input-wrap">
      <i class="fa-solid fa-envelope input-icon"></i>
      <input id="email" type="email" placeholder="you@example.com" class="form-input">
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">OTP Code</label>
    <div class="input-wrap">
      <i class="fa-solid fa-hashtag input-icon"></i>
      <input id="otp" type="text" placeholder="Enter OTP from email" class="form-input" maxlength="10">
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">New Password</label>
    <div class="input-wrap">
      <i class="fa-solid fa-lock input-icon"></i>
      <input id="newPassword" type="password" placeholder="Create new password" class="form-input">
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Confirm New Password</label>
    <div class="input-wrap">
      <i class="fa-solid fa-shield-halved input-icon"></i>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" class="form-input">
    </div>
  </div>

  <button onclick="clickSound.play(); resetPassword()" class="btn-reset">
    <i class="fa-solid fa-rotate"></i> Reset Password
  </button>

  <div class="back-link">
    <span onclick="window.location.href='login.html'">← Back to Login</span>
  </div>
</div>

<script>
const clickSound = new Audio("sounds/click.mp3");

async function resetPassword() {
  const email = document.getElementById("email").value.trim();
  const otp = document.getElementById("otp").value.trim();
  const newPassword = document.getElementById("newPassword").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (!email || !otp || !newPassword || !confirmPassword) {
    alert("All fields are required");
    return;
  }

  if (newPassword !== confirmPassword) {
    alert("Passwords do not match");
    return;
  }

  const res = await fetch("http://localhost:5000/api/auth/reset-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, otp, newPassword })
  });

  const data = await res.json();

  if (res.ok) {
    alert("Password reset successful. Please login.");
    window.location.href = "login.html";
  } else {
    alert(data.message || "Reset failed");
  }
}
</script>
</body>
</html>
